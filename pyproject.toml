[project]
name = "fantasy-draft-analyst"
version = "0.1.0"
description = "Local fantasy football live draft analyst for Sleeper and gtonic/nfl_mcp."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = {"" = "draft_analyst"}

[tool.setuptools.packages.find]
where = ["draft_analyst"]

[project.scripts]
draft-analyst = "fantasy_draft_analyst.cli:main"

[tool.pytest.ini_options]
pythonpath = ["draft_analyst"]
testpaths = ["tests"]
